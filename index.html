<html>
<head>
  <title>Google</title>
  <link rel="icon" href="https://google.com/favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    :root {
        --xbox-bg-dark: #0f141c;
        --xbox-surface: rgba(22, 29, 41, 0.85);
        --xbox-border: #2a384d;
        --xbox-glow: #0084ff;
        --text-color: #ffffff;
        --text-muted: #8a9bb5;
    }

    body {
        margin: 0;
        padding: 0;
        color: var(--text-color);
        font-family: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        position: relative;
        overflow: hidden;
        background-color: var(--xbox-bg-dark);
    }

    .background-video { 
        position: fixed; 
        inset: 0; 
        z-index: 0; 
        width: 100vw; 
        height: 100vh; 
        object-fit: cover; 
        pointer-events: none;
        filter: brightness(0.8);
    }

    header {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        height: 60px;
        padding: 0 2rem;
        position: relative;
        z-index: 10;
        background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
    }

    input, button, select {
        background: var(--xbox-surface);
        color: var(--text-color);
        border: 1px solid var(--xbox-border);
        border-radius: 6px;
        padding: 8px 16px;
        user-select: none;
        font-weight: 600;
        letter-spacing: 0.5px;
        backdrop-filter: blur(8px);
        transition: all 0.2s ease;
    }

    button:hover, input:focus {
        border-color: var(--xbox-glow);
        box-shadow: 0 0 12px rgba(0, 132, 255, 0.4);
        outline: none;
    }

    .title {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: none;
        margin: 0;
        text-align: center;
    }

    .title img {
        max-width: min(300px, 75vw);
        width: 100%;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.8));
    }

    #search {
        position: fixed;
        top: 54%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: auto;
        margin: 0;
        text-align: center;
        transition: all 0.3s ease;
    }

    #search input {
        width: min(480px, 85vw);
        height: 52px;
        border-radius: 26px;
        text-align: center;
        background: rgba(15, 20, 28, 0.75);
        border: 2px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        font-size: 1.05rem;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        font-family: 'Sora', sans-serif;
    }

    #search input::placeholder {
        color: var(--text-muted);
    }

    #search input:focus {
        border-color: #ffffff;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    #overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(10, 14, 20, 0.85);
        backdrop-filter: blur(6px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 100;
    }

    #overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    #settings {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(90vw, 440px);
        max-height: 80vh;
        background: var(--xbox-surface);
        border: 1.5px solid var(--xbox-border);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(16px);
        z-index: 101;
    }

    #settings h3 {
        margin-top: 0;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-size: 1.1rem;
        color: #ffffff;
        border-bottom: 1px solid var(--xbox-border);
        padding-bottom: 12px;
    }

    #gear {
        cursor: pointer;
        font-size: 20px;
    }

    #iframe {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        border: none;
        background: var(--xbox-bg-dark);
        z-index: 5;
        display: none;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body class="default">
  <video class="background-video" id="background-video" autoplay muted playsinline preload="auto" aria-hidden="true" loop>
    <source src="https://cdn.jsdelivr.net/gh/summonthespirit/hosting-2@main/Roblox's%20Old%20Xbox%20One%20UI%20Background%20Animation%20(HQ)%20(4K).mp4" type="video/mp4">
  </video>
  
  <header>
    <div></div>
    <span id="gear"><i class="fa">&#xf013;</i></span>
  </header>

  <div class="title">
    <img src="https://cdn.jsdelivr.net/gh/summonthespirit/hosting-2@main/aero%20roblox%20logo.png" alt="Logo">
  </div>

  <form id="search">
    <input id="url" type="text" class="search-input search" placeholder="Search the web or enter a URL" autocomplete="off">
  </form>

  <div id="overlay">
    <div id="settings">
      <h3>Settings</h3>
      <h4>Wisp Server</h4>
      <form id="wispInput">
        <input id="websocket" type="text" placeholder="wss://w.oneyplaysbestf.art/" value="wss://w.oneyplaysbestf.art/" style="width:100%; margin-bottom:8px;">
        <button type="submit">Set Wisp</button>
      </form>
      <h4>Transport Protocol</h4>
      <label>
        <input type="radio" name="transport" value="epoxy" checked> Epoxy (default)
      </label><br>
      <label>
        <input type="radio" name="transport" value="libcurl"> Libcurl
      </label>
      <h4>Search Engine</h4>
      <select id="searchEnginePicker" style="width:100%;">
        <option value="google">Google</option>
        <option value="bing">Bing</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="brave">Brave</option>
        <option value="custom">Custom</option>
      </select>
      <input id="customSearch" type="text" placeholder="https://search.example.com/search?q=%s" style="display:none; width:100%; margin-top:8px;" />
    </div>
  </div>
  <iframe id="iframe"></iframe>

  <script src="https://cdn.jsdelivr.net/gh/summonthespirit/hosting@main/scramjet/scramjet.all.js" defer></script>
  <script type="module" defer>

    const scramjet = new ScramjetController({ 
      prefix: "/scramjet/", 
      files: { 
        wasm: "https://cdn.jsdelivr.net/gh/summonthespirit/hosting@main/scramjet/wasm.wasm", 
        all: "https://cdn.jsdelivr.net/gh/summonthespirit/hosting@main/scramjet/scramjet.all.js", 
        sync: "https://cdn.jsdelivr.net/gh/summonthespirit/hosting@main/scramjet/scramjet.sync.js" 
      } 
    });

    async function initScramjet() {
      try {
        if ("serviceWorker" in navigator) {
          const swCode = `
            importScripts("https://cdn.jsdelivr.net/gh/summonthespirit/hosting@main/scramjet/scramjet.all.js");
            const { ScramjetServiceWorker } = $scramjetLoadWorker();
            const scramjetSW = new ScramjetServiceWorker();

            self.addEventListener("install", () => self.skipWaiting());
            self.addEventListener("activate", (event) => event.waitUntil(self.clients.claim()));

            async function handleRequest(event) {
              await scramjetSW.loadConfig();
              if (scramjetSW.route(event)) { return await scramjetSW.fetch(event); }
              return await fetch(event.request);
            }
            self.addEventListener('fetch', (event) => { event.respondWith(handleRequest(event)); });
          `;
          const dataUrl = "data:application/javascript;base64," + btoa(swCode);
          await navigator.serviceWorker.register(dataUrl, { scope: "/" });
        }
        scramjet.init();
      } catch (e) { 
        console.error("scramjet failed to initialize;", e); 
      }
    }

    initScramjet();

    const connection = new BareMux.BareMuxConnection(bareworker);

    const settings = document.getElementById("settings");
    const gear = document.getElementById("gear");
    const overlay = document.getElementById("overlay"); 
    const wispInput = document.getElementById("wispInput");
    const transports = document.querySelectorAll('input[name="transport"]');
    const searchEnginePicker = document.getElementById('searchEnginePicker');
    const customSearchInput = document.getElementById('customSearch');
    const iframe = document.getElementById("iframe");
    const titleDiv = document.querySelector(".title");
    const searchForm = document.getElementById("search");
    const bgVideo = document.getElementById("background-video");

    bgVideo.play().catch(() => {
      window.addEventListener('click', () => { bgVideo.play(); }, { once: true });
    });

    gear.onclick = () => { overlay.classList.toggle("active"); settings.classList.toggle("open"); }
    overlay.onclick = e => { if (e.target === overlay) { overlay.classList.remove("active"); settings.classList.remove("open"); } }
    document.onkeydown = e => { if (e.key === "Escape") { overlay.classList.remove("active"); settings.classList.remove("open"); } }

    function getWispUrl() {
      const wisp = document.getElementById("websocket").value.trim();
      const defaultWisp = "wss://w.oneyplaysbestf.art/";
      return wisp || defaultWisp;
    }

    async function setTransport(transportsel) {
      const wispUrl = getWispUrl();
      localStorage.setItem('selectedTransport', transportsel);
      switch (transportsel) {
        case "epoxy":
          await connection.setTransport("https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport/dist/index.mjs", [{ wisp: wispUrl }]);
          break;
        case "libcurl":
          await connection.setTransport("https://cdn.jsdelivr.net/npm/@mercuryworkshop/libcurl-transport/dist/index.mjs", [{ websocket: wispUrl }]);
          break;
        default:
          await connection.setTransport("https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport/dist/index.mjs", [{ wisp: wispUrl }]);
          break;
      }
    }

    const searchTemplates = {
      google: "https://www.google.com/search?q=%s",
      bing: "https://www.bing.com/search?q=%s",
      duckduckgo: "https://duckduckgo.com/?q=%s",
      brave: "https://search.brave.com/search?q=%s",
      ecosia: "https://www.ecosia.org/search?method=index&ar=1&q=%s"
    };

    function search(input) {
      try {
        return new URL(input).toString();
      } catch (err) {}

      try {
        let url = new URL(`http://${input}`);
        if (url.hostname.includes(".")) return url.toString();
      } catch (err) {}

      const engine = (localStorage.getItem('selectedSearchEngine') || 'google');
      let template;
      if (engine === 'custom') {
        template = (customSearchInput.value && customSearchInput.value.trim()) || localStorage.getItem('customSearchTemplate') || "";
      } else {
        template = searchTemplates[engine] || searchTemplates.brave;
      }

      if (!template) template = searchTemplates.brave;
      return template.replace("%s", encodeURIComponent(input));
    }

    const currentWisp = localStorage.getItem('selectedWisp') || "wss://w.oneyplaysbestf.art/";
    const currentTransport = localStorage.getItem('selectedTransport') || "epoxy";
    const currentSearchEngine = localStorage.getItem('selectedSearchEngine') || "brave";
    const currentCustomTemplate = localStorage.getItem('customSearchTemplate') || "";

    document.getElementById("websocket").value = currentWisp;
    document.querySelector(`input[value="${currentTransport}"]`).checked = true;
    searchEnginePicker.value = currentSearchEngine;
    customSearchInput.value = currentCustomTemplate;
    customSearchInput.style.display = (currentSearchEngine === 'custom') ? 'block' : 'none';

    setTransport(currentTransport); 
        
    wispInput.addEventListener("submit", async (event) => {
      event.preventDefault();
      const newWisp = document.getElementById("websocket").value.trim();
      localStorage.setItem('selectedWisp', newWisp);
      const currentTransport = document.querySelector('input[name="transport"]:checked').value;
      await setTransport(currentTransport);
    });

    transports.forEach(radio => {
      radio.addEventListener('change', async (event) => {
        await setTransport(event.target.value);
      });
    });

    searchEnginePicker.addEventListener('change', (event) => {
      const engine = event.target.value;
      localStorage.setItem('selectedSearchEngine', engine);
      if (engine === 'custom') {
        customSearchInput.style.display = 'block';
      } else {
        customSearchInput.style.display = 'none';
      }
    });

    customSearchInput.addEventListener('blur', (e) => {
      const val = e.target.value.trim();
      localStorage.setItem('customSearchTemplate', val);
    });
    customSearchInput.addEventListener('change', (e) => {
      const val = e.target.value.trim();
      localStorage.setItem('customSearchTemplate', val);
    });
    
    searchForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      let fixedurl = search(document.getElementById("url").value);
      let src = scramjet.encodeUrl(fixedurl);
      
      titleDiv.style.display = "none";
      searchForm.style.position = "fixed";
      searchForm.style.top = "15px";
      searchForm.style.left = "2rem";
      searchForm.style.transform = "none";
      
      iframe.style.display = "block";
      iframe.src = src;
    });
  </script>
</body>
</html>
