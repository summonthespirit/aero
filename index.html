<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <script src="ads.js"></script>
  <link rel="icon" href="https://google.com/favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    :root {
        --bg-dark: #0f141c;
        --surface: rgba(22, 29, 41, 0.85);
        --border: #2a384d;
        --glow: #0084ff;
        --text-color: #ffffff;
        --text-muted: #8a9bb5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        margin: 0;
        padding: 0;
        color: var(--text-color);
        font-family: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        position: relative;
        overflow: hidden;
        background-color: var(--bg-dark);
        height: 100vh;
    }

    .background-video { 
        position: fixed; 
        inset: 0; 
        z-index: 0; 
        width: 100vw; 
        height: 100vh; 
        object-fit: cover; 
        pointer-events: none;
        filter: brightness(0.8);
    }

    header {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        height: 60px;
        padding: 0 2rem;
        position: relative;
        z-index: 10;
        background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
    }

    input, button, select {
        background: var(--surface);
        color: var(--text-color);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 16px;
        user-select: none;
        font-weight: 600;
        letter-spacing: 0.5px;
        backdrop-filter: blur(8px);
        transition: all 0.2s ease;
    }

    button:hover, input:focus {
        border-color: var(--glow);
        box-shadow: 0 0 12px rgba(0, 132, 255, 0.4);
        outline: none;
    }

    .title {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: none;
        margin: 0;
        text-align: center;
    }

    .title img {
        max-width: min(300px, 75vw);
        width: 100%;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.8));
    }

    #search {
        position: fixed;
        top: 54%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: auto;
        margin: 0;
        text-align: center;
        transition: all 0.3s ease;
    }

    #search input {
        width: min(480px, 85vw);
        height: 52px;
        border-radius: 26px;
        text-align: center;
        background: rgba(15, 20, 28, 0.75);
        border: 2px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        font-size: 1.05rem;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        font-family: 'Sora', sans-serif;
    }

    #search input::placeholder {
        color: var(--text-muted);
    }

    #search input:focus {
        border-color: #ffffff;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    #status {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
      z-index: 10;
      letter-spacing: 0.03em;
    }

    #overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(10, 14, 20, 0.85);
        backdrop-filter: blur(6px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 100;
    }

    #overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    #settings {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(90vw, 440px);
        max-height: 80vh;
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(16px);
        z-index: 101;
    }

    #settings h3 {
        margin-top: 0;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-size: 1.1rem;
        color: #ffffff;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
    }

    #gear {
        cursor: pointer;
        font-size: 20px;
    }

    #browser {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        border: none;
        background: var(--bg-dark);
        z-index: 10000000;
        display: none;
    }
    #browser.visible { display: block; }

    #load-bar {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      width: 0%;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(126,200,255,0.6);
      z-index: 25;
      opacity: 0;
      border-radius: 0 2px 2px 0;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&amp;display=swap" rel="stylesheet">
</head>
<body class="default">
  <video class="background-video" id="background-video" autoplay="true" playsinline="true" preload="auto" aria-hidden="true" loop="">
    <source src="https://cdn.jsdelivr.net/gh/summonthespirit/hosting-2@main/Roblox's%20Old%20Xbox%20One%20UI%20Background%20Animation%20(HQ)%20(4K).mp4" type="video/mp4">
  </video>
  
  <header>
    <div></div>
    <span id="gear"><i class="fa"></i></span>
  </header>

  <div class="title">
    <img src="https://cdn.jsdelivr.net/gh/summonthespirit/hosting-2@main/aero%20roblox%20logo.png" alt="Logo">
  </div>

  <form id="search">
    <input id="url" type="text" class="search-input search" placeholder="Search the web or enter a URL" autocomplete="off" autocorrect="off" spellcheck="false">
  </form>

  <p id="status" style="display: none;">ready</p>

  <div id="overlay" class="">
    <div id="settings" class="">
      <h3>settings</h3>
        <br>
      <h4>wisp server</h4>
    <br>
      <form id="wispInput">
        <input id="websocket" type="text" placeholder="wss://anura.pro/wisp/" value="wss://anura.pro/wisp/" style="width:100%; margin-bottom:8px;">
        <button type="submit">set wisp</button>
      </form>
    <br>
      <h4>transport</h4>
    <br>
      <label>
        <input type="radio" name="transport" value="libcurl" checked=""> libcurl (default)
      </label><br>
      <label>
        <input type="radio" name="transport" value="epoxy"> epoxy
      </label>
    <br>
      <h4>search engine</h4>
      <select id="searchEnginePicker" style="width:100%;">
        <option value="google">google</option>
        <option value="bing">bing</option>
        <option value="duckduckgo">duckduckgo</option>
        <option value="brave">brave</option>
      </select>
    </div>
  </div>

  <iframe id="browser" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads" allow="autoplay; fullscreen"></iframe>
  <div id="load-bar"></div>

  <script src="app.js" type="module"></script>

</body></html>
